services:
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    environment:
      ENVIRONMENT: development
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
